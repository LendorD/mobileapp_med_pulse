basePath: /api/v1
definitions:
  entities.Analysis:
    properties:
      code:
        type: string
      id:
        type: integer
      price:
        type: integer
      title:
        type: string
    type: object
  entities.AttendingDoctor:
    properties:
      attachmentEnd:
        type: string
      attachmentStart:
        type: string
      clinic:
        type: string
      fullName:
        type: string
      policyOrCertNumber:
        type: string
      specialization:
        type: string
    type: object
  entities.CallStatus:
    enum:
    - completed
    - process
    type: string
    x-enum-comments:
      CallStatusCompleted: 'исправлено: было "compleated"'
      CallStatusWork: 'исправлено: было "proccess"'
    x-enum-descriptions:
    - 'исправлено: было "compleated"'
    - 'исправлено: было "proccess"'
    x-enum-varnames:
    - CallStatusCompleted
    - CallStatusWork
  entities.Certificate:
    properties:
      date:
        type: string
      number:
        type: string
    type: object
  entities.ClientRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  entities.DoctorData:
    properties:
      id:
        type: integer
      name:
        type: string
      specialization:
        type: string
    type: object
  entities.Emk:
    properties:
      analysis:
        $ref: '#/definitions/entities.Analysis'
      call_id:
        type: string
      created_at:
        type: string
      doctor:
        $ref: '#/definitions/entities.DoctorData'
      flg:
        $ref: '#/definitions/entities.Flg'
      id:
        type: integer
      med_services:
        items:
          type: integer
        type: array
      patient_id:
        description: связь с пациентом
        type: string
      status:
        $ref: '#/definitions/entities.CallStatus'
      updated_at:
        type: string
    type: object
  entities.File:
    properties:
      createdAt:
        type: string
      filename:
        type: string
      id:
        type: integer
      minioKey:
        description: '"minio_id"'
        type: string
    type: object
  entities.Flg:
    properties:
      created_at:
        type: string
      date:
        type: string
      file:
        $ref: '#/definitions/entities.File'
      file_id:
        type: integer
      id:
        type: integer
      number:
        type: string
      organization:
        type: string
      patient_id:
        type: integer
      result:
        type: string
    type: object
  entities.OneCMedicalCard:
    properties:
      additional_phone:
        type: string
      address:
        type: string
      age:
        type: string
      birth_date:
        type: string
      certificate:
        $ref: '#/definitions/entities.Certificate'
      display_name:
        description: Основные поля
        type: string
      doctor:
        $ref: '#/definitions/entities.AttendingDoctor'
      email:
        type: string
      legal_representative:
        allOf:
        - $ref: '#/definitions/entities.ClientRef'
        description: Вложенные структуры
      mobile_phone:
        type: string
      patient_id:
        type: string
      policy:
        $ref: '#/definitions/entities.Policy'
      relative:
        $ref: '#/definitions/entities.Relative'
      snils:
        type: string
      workplace:
        type: string
    type: object
  entities.OneCPatientListItem:
    properties:
      birthDate:
        description: в формате "YYYY-MM-DD"
        type: string
      fullName:
        type: string
      gender:
        description: true — мужской
        type: boolean
      id:
        type: integer
      patientID:
        type: string
    type: object
  entities.PatientListUpdate:
    properties:
      patients:
        items:
          $ref: '#/definitions/entities.OneCPatientListItem'
        type: array
    type: object
  entities.Policy:
    properties:
      number:
        type: string
      type:
        type: string
    type: object
  entities.Receptions:
    properties:
      data:
        items:
          type: integer
        type: array
      id:
        type: integer
    type: object
  entities.Relative:
    properties:
      name:
        type: string
      status:
        type: string
    type: object
  handlers.AuthCreditionals:
    properties:
      users:
        items:
          $ref: '#/definitions/handlers.OneCUser'
        type: array
    type: object
  handlers.IncorrectDataError:
    properties:
      response:
        properties:
          code:
            example: 401
            type: integer
          message:
            example: Некорректные данные
            type: string
        type: object
      status:
        description: error
        example: IncorrectDataError
        type: string
    type: object
  handlers.IncorrectFormatError:
    properties:
      response:
        properties:
          code:
            example: 400
            type: integer
          message:
            example: Неверный формат запроса
            type: string
        type: object
      status:
        description: error
        example: IncorrectFormatError
        type: string
    type: object
  handlers.InternalServerError:
    properties:
      response:
        properties:
          code:
            example: 500
            type: integer
          message:
            example: Внутренняя ошибка сервера
            type: string
        type: object
      status:
        description: error
        example: InternalServerError
        type: string
    type: object
  handlers.OneCUser:
    properties:
      login:
        example: doc1
        type: string
      password:
        example: secret123
        type: string
    type: object
  handlers.ResultError:
    properties:
      response:
        properties:
          code:
            description: '[RULE]: must be one of codes from table (Check DEV.PAGE)'
            example: 400
            type: integer
          message:
            example: Bad request
            type: string
        type: object
      status:
        description: error
        example: error
        type: string
    type: object
  handlers.ResultResponse:
    properties:
      response:
        properties:
          data:
            description: '[AVALIABLE]: object, array of objects, empty'
          message:
            example: Success operation
            type: string
          type:
            description: '[AVALIABLE]: object, array, empty'
            example: object
            type: string
        type: object
      status:
        description: ok
        example: ok
        type: string
    type: object
  models.AnalysisResponse:
    properties:
      code:
        type: string
      id:
        type: integer
      price:
        type: integer
      title:
        type: string
    type: object
  models.Call:
    properties:
      address:
        type: string
      analysis:
        $ref: '#/definitions/entities.Analysis'
      call_id:
        type: string
      doctor:
        $ref: '#/definitions/entities.DoctorData'
      flg:
        $ref: '#/definitions/entities.Flg'
      med_services:
        items:
          type: integer
        type: array
      patients:
        items:
          $ref: '#/definitions/entities.OneCPatientListItem'
        type: array
      phone:
        type: string
      receptions:
        items:
          $ref: '#/definitions/entities.Receptions'
        type: array
      status:
        $ref: '#/definitions/entities.CallStatus'
    type: object
  models.DoctorAuthResponse:
    description: Ответ с данными авторизованного врача
    properties:
      id:
        description: ID врача
        example: 1
        type: integer
      token:
        description: JWT токен
        example: eyJhbGciOi...
        type: string
    type: object
  models.DoctorLoginRequest:
    description: Запрос для входа врача в систему
    properties:
      password:
        description: Пароль
        example: password123
        type: string
      phone:
        description: Логин (телефон)
        example: "+79622840765"
        type: string
    required:
    - password
    - phone
    type: object
  models.PatientListResponse:
    properties:
      patient:
        items:
          $ref: '#/definitions/entities.OneCPatientListItem'
        type: array
    type: object
  models.UpdateAnalysisOrderItemDTO:
    properties:
      analysis_id:
        minimum: 1
        type: integer
      completed_at:
        type: string
      is_completed:
        type: boolean
    required:
    - analysis_id
    type: object
  models.UpdateAnalysisOrderRequest:
    properties:
      id:
        minimum: 1
        type: integer
      order_items:
        items:
          $ref: '#/definitions/models.UpdateAnalysisOrderItemDTO'
        type: array
      patient_id:
        minimum: 1
        type: integer
    required:
    - id
    - order_items
    - patient_id
    type: object
info:
  contact:
    email: support@example.com
    name: API Support
  description: API для работы с приёмами пациентов
  title: ClinicHub API
  version: 1.0.0
paths:
  /analysis:
    get:
      description: Возвращает полный список доступных анализов
      produces:
      - application/json
      responses:
        "200":
          description: Список анализов
          schema:
            items:
              $ref: '#/definitions/models.AnalysisResponse'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handlers.ResultError'
      security:
      - BearerAuth: []
      - JWTAuth: []
      summary: Получить все анализы
      tags:
      - Files
  /analysis/update:
    post:
      consumes:
      - application/json
      description: Обновляет список анализов в направлении
      parameters:
      - description: Данные направления
        in: body
        name: info
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAnalysisOrderRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Направление успешно обновлено
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "404":
          description: Направление не найдено
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "422":
          description: Ошибка валидации данных
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handlers.ResultError'
      security:
      - JWTAuth: []
      summary: Обновить направление на анализы
      tags:
      - Files
  /auth:
    post:
      consumes:
      - application/json
      description: Аутентифицирует врача по номеру телефона и паролю
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.DoctorLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное создание
          schema:
            $ref: '#/definitions/models.DoctorAuthResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/handlers.IncorrectFormatError'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/handlers.IncorrectDataError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handlers.InternalServerError'
      summary: Вход в систему
      tags:
      - Auth
  /emk/{pat_id}:
    get:
      parameters:
      - description: Patient ID
        in: path
        name: pat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entities.Emk'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTAuth: []
      summary: Get all EMK records by patient ID
      tags:
      - EMK
  /files/{id}:
    get:
      description: Возвращает бинарные данные файла по его идентификатору. Устанавливает
        правильные заголовки Content-Type, Content-Length и Content-Disposition.
      parameters:
      - description: ID файла
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Файл в виде бинарных данных
          schema:
            type: string
        "400":
          description: Некорректный ID файла (не число)
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "401":
          description: Неавторизован (отсутствует или невалиден токен)
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "404":
          description: Файл не найден
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handlers.ResultError'
      security:
      - JWTAuth: []
      summary: Получить файл по ID
      tags:
      - Files
  /flgs/:
    post:
      consumes:
      - multipart/form-data
      description: Загружает фото и создаёт запись
      parameters:
      - description: ID пациента
        in: formData
        name: patient_id
        required: true
        type: integer
      - description: Организация
        in: formData
        name: organization
        required: true
        type: string
      - description: Номер
        in: formData
        name: number
        required: true
        type: string
      - description: Результат
        in: formData
        name: result
        required: true
        type: string
      - description: Дата (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: Фото (JPEG/PNG, до 10 МБ)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Созданная флюрография
          schema:
            $ref: '#/definitions/handlers.ResultResponse'
        "400":
          description: Некорректный запрос (например, неверный формат даты)
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "401":
          description: Неавторизован (отсутствует или невалиден токен)
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "404":
          description: Пациент или организация не найдены
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "422":
          description: Семантическая ошибка (например, patient_id=0)
          schema:
            $ref: '#/definitions/handlers.ResultError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handlers.ResultError'
      security:
      - JWTAuth: []
      summary: Создать флюорографию с фото
      tags:
      - Files
  /medcard/{pat_id}:
    get:
      parameters:
      - description: Patient ID
        in: path
        name: pat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.OneCMedicalCard'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTAuth: []
      summary: Get medical card by patient ID
      tags:
      - MedicalCard
    put:
      consumes:
      - application/json
      parameters:
      - description: Patient ID
        in: path
        name: pat_id
        required: true
        type: string
      - description: Medical card update data
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/entities.OneCMedicalCard'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTAuth: []
      summary: Update medical card by patient ID
      tags:
      - MedicalCard
  /onec/auth:
    post:
      consumes:
      - application/json
      description: Syncs a batch of users (login + password) received from 1C into
        the internal auth system.
      parameters:
      - description: List of users to sync
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthCreditionals'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Sync users from 1C
      tags:
      - 1C
  /patients:
    get:
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PatientListResponse'
      security:
      - JWTAuth: []
      summary: Get cached patient list from 1C with pagination
      tags:
      - Patients
  /webhook/onec/patients:
    post:
      consumes:
      - application/json
      parameters:
      - description: Patient list update from 1C
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/entities.PatientListUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 'Webhook from 1C: patient list update'
      tags:
      - 1C
  /webhook/onec/receptions:
    post:
      consumes:
      - application/json
      parameters:
      - description: Receptions update
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/models.Call'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 'Webhook from 1C: new receptions'
      tags:
      - 1C
  /ws/notification/register/{user_id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: User id
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Подписаться на уведомления
      tags:
      - Websocket
  /ws/notification/unregister/{user_id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: User id
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Отписаться от уведомлений
      tags:
      - Websocket
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer <JWT>" to authenticate
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
